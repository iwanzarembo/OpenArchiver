name: CI

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.34.7

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            # The unit tests import from packages/backend/dist, and the frontend check
            # needs the generated SvelteKit files; build:oss covers both packages.
            - name: Build
              run: pnpm build:oss

            - name: Unit tests
              run: pnpm --filter @open-archiver/backend test:unit

            - name: Svelte check
              run: pnpm --filter @open-archiver/frontend check
